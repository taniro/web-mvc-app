<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Tarefas</title>
</head>
<body>
<form method="POST" action="#" th:action="@{/salvar}" th:object="${tarefa}">
    <input type="text" name="descricao" th:field="*{descricao}"/> <br />
    <select name="ativo" th:field="*{ativo}">
        <option value="true"> Ativo
        </option>
        <option value="false">
            Inativo
        </option>
    </select>
    <button type="submit">Enviar</button>
</form>
</body>
</html>
